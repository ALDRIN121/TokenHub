[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenhub"
version = "0.1.8"
description = "Local-first TokenHub"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
    # Newer patched releases require Python 3.11; 3.20.3 is outside the reported affected ranges.
    "filelock>=3.20.3,<3.20.4; python_version < '3.11'",
    "filelock>=4.2.1,<5; python_version >= '3.11'",
    "psutil>=5.9,<8",
    "tzdata>=2026.4",
]

[project.scripts]
tokenhub = "tokenhub.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-psutil>=7.2.2.20260906",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
tokenhub = ["web/index.html", "web/favicon.svg", "web/assets/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"

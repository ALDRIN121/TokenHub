[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenhub"
version = "0.1.1"
description = "Local-first TokenHub"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "filelock>=3.12,<4",
    "psutil>=5.9,<8",
]

[project.scripts]
tokenhub = "tokenhub.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "types-psutil>=7.2.2.20260906",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
tokenhub = ["web/index.html", "web/favicon.svg", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"

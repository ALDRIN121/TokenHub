name: Feature request
description: Describe a usage problem and the behavior that would help.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow and the missing information or behavior.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what you would expect TokenHub to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Use synthetic examples and exclude private session data.

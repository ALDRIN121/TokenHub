name: Publish TokenHub

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Package index
        required: true
        type: choice
        options: [testpypi, pypi]
      version:
        description: Version expected in pyproject.toml
        required: true
        type: string
      wheel_sha256:
        description: Reviewed TestPyPI wheel SHA-256 (required for PyPI)
        required: false
        type: string
      sdist_sha256:
        description: Reviewed TestPyPI source archive SHA-256 (required for PyPI)
        required: false
        type: string
      dry_run:
        description: Verify release artifacts without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python -c "import os, tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == os.environ['EXPECTED_VERSION']"
      - name: Build checked dashboard
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          git status --porcelain -- backend/tokenhub/web | tee ui-status.txt
          git diff --numstat -- backend/tokenhub/web
          test ! -s ui-status.txt
      - name: Test and build package
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen pytest -q
          uv run --frozen ruff check backend tests scripts
          uv run --frozen mypy backend
          uv build
          python scripts/verify_distribution.py dist/*
      - name: Save verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: tokenhub-distributions
          path: dist/*
          if-no-files-found: error

  prepare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download verified distributions
        if: inputs.destination == 'testpypi'
        uses: actions/download-artifact@v7
        with:
          name: tokenhub-distributions
          path: dist
      - name: Download reviewed TestPyPI distributions
        if: inputs.destination == 'pypi'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SDIST_SHA256: ${{ inputs.sdist_sha256 }}
        run: python scripts/download_testpypi_release.py "$RELEASE_VERSION" "$WHEEL_SHA256" "$SDIST_SHA256" dist
      - name: Verify reviewed TestPyPI distributions
        if: inputs.destination == 'pypi'
        run: python scripts/verify_distribution.py dist/*
      - name: Save release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

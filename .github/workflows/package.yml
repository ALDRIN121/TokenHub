name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            label: Verify ubuntu-latest
          - os: macos-latest
            python-version: '3.12'
            label: Verify macos-latest
          - os: windows-latest
            python-version: '3.12'
            label: Verify windows-latest
          - os: ubuntu-latest
            python-version: '3.10'
            label: Verify Python 3.10 (ubuntu-latest)
          - os: macos-latest
            python-version: '3.10'
            label: Verify Python 3.10 (macos-latest)
          - os: windows-latest
            python-version: '3.10'
            label: Verify Python 3.10 (windows-latest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Check bundled dashboard
        shell: bash
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test -- --run
          npm --prefix frontend run build
          git status --porcelain -- backend/tokenhub/web | tee ui-status.txt
          git diff --numstat -- backend/tokenhub/web
          test ! -s ui-status.txt
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - name: Test and type check
        shell: bash
        run: |
          uv run --frozen pytest -q
          uv run --frozen pytest tests/integration -m integration -q
          uv run --frozen ruff check backend tests scripts
          uv run --frozen mypy backend
      - name: Build and smoke-test wheel and source archive
        shell: bash
        run: |
          uv build
          python scripts/verify_distribution.py dist/*
